<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice AI Tools</title>
  <style>
    :root{--bg:#0b1a15;--accent:#4CC9F0;--accent2:#7B2FBE;--warn:#F72585;--ok:#06D6A0;--text:#e0e0e0;--panel:rgba(15,61,62,0.6);--glow:0 0 20px rgba(76,201,240,0.3)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:radial-gradient(ellipse at 50% 30%,rgba(15,61,62,.5) 0%,transparent 70%),#0b1a15;color:var(--text);font-family:system-ui,sans-serif;width:400px;min-height:580px;padding:0}
    header{padding:16px 20px 0;display:flex;align-items:center;justify-content:space-between}
    h1{font-size:1rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);text-shadow:var(--glow)}
    .status-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .tabs{display:flex;margin:14px 20px 0;border-bottom:1px solid rgba(76,201,240,.2)}
    .tab{flex:1;padding:8px 0;text-align:center;font-size:.65rem;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;color:rgba(224,224,224,.4);border-bottom:2px solid transparent;transition:all .2s}
    .tab.active{color:var(--accent);border-bottom-color:var(--accent);text-shadow:0 0 10px rgba(76,201,240,.6)}
    .tab:hover{color:var(--accent)}
    .panel{display:none;padding:14px 20px 20px}
    .panel.active{display:block}
    .visualizer{width:100%;height:56px;background:var(--panel);border-radius:8px;overflow:hidden;margin-bottom:12px;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding:4px}
    .bar{width:4px;border-radius:2px;background:var(--accent);min-height:4px;transition:height .1s}
    textarea{width:100%;background:var(--panel);border:1px solid rgba(76,201,240,.25);border-radius:8px;color:var(--text);font-size:.85rem;padding:10px;resize:none;outline:none;height:76px;margin-bottom:10px}
    textarea:focus{border-color:var(--accent);box-shadow:var(--glow)}
    .row{display:flex;gap:8px;margin-bottom:10px}
    select,input[type=text],input[type=password]{flex:1;background:var(--panel);border:1px solid rgba(76,201,240,.2);border-radius:6px;color:var(--text);font-size:.8rem;padding:7px 10px;outline:none}
    select:focus,input:focus{border-color:var(--accent)}
    .btn{padding:9px 18px;border-radius:6px;border:none;font-size:.78rem;font-weight:600;letter-spacing:.08em;cursor:pointer;transition:all .2s}
