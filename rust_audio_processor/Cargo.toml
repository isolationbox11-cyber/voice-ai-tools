[package]
name = "audio_processor"
version = "0.1.0"
edition = "2021"
crate-type = ["cdylib", "rlib"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["AudioContext", "AudioBuffer", "AudioBufferSourceNode"] }
js-sys = "0.3"

[profile.release]
opt-level = "z"
lto = true
