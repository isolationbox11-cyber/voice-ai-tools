name: PR Visual Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python deps
        run: |
          pip install --quiet \
          flask flask-cors flask-limiter python-dotenv \
          requests dnspython python-whois phonenumbers Pillow

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start Flask server
        env:
          FLASK_ENV: development
          PORT: 5001
        run: |
          python flask_server.py &
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:5001/health && break
            sleep 1
          done

      - name: Capture UI screenshots
        run: |
          mkdir -p screenshots
          node - <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({
              viewport: { width: 900, height: 600 },
            });
            async function shot(url, filename, waitMs = 1500) {
              const page = await context.newPage();
              try {
                await page.goto(url, { waitUntil: 'networkidle', timeout: 15000 });
                await page.waitForTimeout(waitMs);
                await page.screenshot({ path: `screenshots/${filename}`, fullPage: false });
                console.log(`captured: ${filename}`);
              } catch (e) {
                console.error(`failed ${filename}:`, e.message);
              } finally {
                await page.close();
              }
            }
            await shot('http://127.0.0.1:5001/', '01-health.png');
            const fs = require('fs');
            const path = require('path');
            const htmlPath = path.resolve('interactive_voice_visualizer.html');
            if (fs.existsSync(htmlPath)) {
              const page2 = await context.newPage();
              await page2.goto(`file://${htmlPath}`, { waitUntil: 'load' });
              await page2.waitForTimeout(2000);
              await page2.screenshot({ path: 'screenshots/02-visualizer.png', fullPage: false });
              console.log('captured: 02-visualizer.png');
              await page2.close();
            }
            const page3 = await context.newPage();
            await page3.setContent(`
              <!DOCTYPE html><html><body style="background:#0d1117;color:#58a6ff;font-family:monospace;padding:24px">
              <h2 style="color:#c9d1d9">/api/lookup live test</h2>
              <pre id="out">loading...</pre>
              <script>
              fetch('http://127.0.0.1:5001/api/lookup',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({query:'github.com'})
              }).then(r=>r.json()).then(d=>{
                document.getElementById('out').textContent=JSON.stringify(d,null,2);
              }).catch(e=>{
                document.getElementById('out').textContent='error: '+e;
              });
              <\/script>
              </body></html>
            `);
            await page3.waitForTimeout(4000);
            await page3.screenshot({ path: 'screenshots/03-lookup-result.png', fullPage: false });
            console.log('captured: 03-lookup-result.png');
            await page3.close();
            await browser.close();
          })();
          EOF

      - name: Compress screenshots
        run: |
          python - <<'EOF'
          from PIL import Image
          import os, pathlib

          MAX_B64_BYTES = 18000
          shots_dir = pathlib.Path('screenshots')

          for png in sorted(shots_dir.glob('*.png')):
              img = Image.open(png).convert('RGB')
              w, h = img.size
              if w > 700:
                  img = img.resize((700, int(h * 700 / w)), Image.LANCZOS)
              out = png.with_suffix('.jpg')
              quality = 72
              while quality >= 20:
                  img.save(out, 'JPEG', quality=quality, optimize=True)
                  import base64
                  b64_size = len(base64.b64encode(out.read_bytes()))
                  if b64_size <= MAX_B64_BYTES:
                      break
                  quality -= 8
              png.unlink()
              print(f'{png.name} -> {out.name} ({b64_size} b64 bytes, quality={quality})')
          EOF

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshots-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: screenshots/
          retention-days: 14

      - name: Post screenshot comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const runId = context.runId;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;

            const dir = 'screenshots';
            let files = [];
            try { files = fs.readdirSync(dir).filter(f => f.endsWith('.jpg')).sort(); } catch {}

            const labels = {
              '01-health.jpg':        '🟢 Flask `/health`',
              '02-visualizer.jpg':    '🎙️ Voice Visualizer',
              '03-lookup-result.jpg': '🔍 `/api/lookup` (github.com)',
            };

            let body = `## 📸 PR Visual Preview\n\n`;
            body += `> Commit \`${context.sha.slice(0,7)}\` — [full run](${runUrl})\n\n`;

            if (files.length === 0) {
              body += '_No screenshots captured — check the workflow logs._';
            } else {
              for (const f of files) {
                const label = labels[f] || f.replace(/^\d+-/, '').replace('.jpg', '');
                const imgBuffer = fs.readFileSync(path.join(dir, f));
                const b64 = imgBuffer.toString('base64');
                body += `**${label}**\n\n`;
                body += `![${label}](data:image/jpeg;base64,${b64})\n\n`;
              }
            }

            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: prNumber });
            for (const c of comments.data) {
              if (c.body.startsWith('## 📸 PR Visual Preview')) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
              }
            }

            await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
